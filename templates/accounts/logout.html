<!DOCTYPE html>
<html>
<head>
    <title>Odhlášen - WWT3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logout-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
        }
        
        .login-link {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .login-link:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h2>Successfully Logged Out</h2>
        <p>You have been logged out of your account.</p>
        <a href="/accounts/login/" class="login-link">Login Again</a>
    </div>
</body>
</html>
