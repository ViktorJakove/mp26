<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWT3 - Stavíme!</title>
    {% load static %}
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .loading-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #e74c3c;
            margin-top: 20px;
            display: none;
        }
        
        .login-link {
            margin-top: 20px;
            display: none;
        }
        
        .login-link a {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .login-link a:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loading-container">
        <h2>WWT3</h2>
        <div class="spinner"></div>
        <p>Checking authentication...</p>
        <div class="error" id="error-message"></div>
        <div class="login-link" id="login-link">
            <a href="/accounts/login/">Go to Login</a>
        </div>
    </div>

    <script>
        async function checkAuth() {
            try {
                const response = await fetch('/accounts/profile/', { method: 'HEAD' });
                if (response.ok) {
                    window.location.href = '/game/';
                } else {
                    document.querySelector('.spinner').style.display = 'none';
                    document.querySelector('p').textContent = 'You need to login to play';
                    document.getElementById('login-link').style.display = 'block';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('p').textContent = 'Connection error';
                document.getElementById('error-message').textContent = 'Could not connect to server';
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('login-link').style.display = 'block';
            }
        }

        checkAuth();
    </script>
</body>
</html>
